name: Manual publish stream-symbols workaround

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-stream-symbols
  cancel-in-progress: false

jobs:
  publish:
    name: Publish local stream-symbols
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4'

      - name: Publish stream symbols to Nexus
        env:
          ORG_GRADLE_PROJECT_nexusUser: ${{ secrets.SE_NEXUS_USER }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.SE_NEXUS_PASSWORD }}
        run: |
          gradle publishStreamSymbolsToNexus \
            -Pci \
            --build-cache \
            --stacktrace
