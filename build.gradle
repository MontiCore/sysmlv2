/* (c) https://github.com/MontiCore/monticore */
subprojects {
  apply plugin: 'java'
  apply plugin: 'maven-publish'

  group = 'de.monticore.lang.sysml_v2'

  // Needs to be after java plugin
  sourceCompatibility = JavaVersion.VERSION_11

  project.buildDir = "target"

  repositories {
    // SE-Nexus also caches maven central
    maven {
      name "SE Nexus"
      url = publicNexus
    }
  }

  // Java JDK Warning
  if (JavaVersion.current() > sourceCompatibility
      && JavaVersion.current() != JavaVersion.VERSION_17)
  {
    logger.warn("\u001B[33m Warning: You are currently using JDK Version " +
        JavaVersion.current() + ". " + "Higher JDK versions may cause " +
        "compatibility problems. JDK 11 or 17 is recommended. \u001B[0m")
  }

  // Use the same testing framework for all modules
  dependencies {
    implementation "org.slf4j:slf4j-simple:2.0.0-beta1"
    // Test annotations, api
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_version"
    // Parametrized tests
    testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_version"
    // Runtime
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_version"
    // AssertJ fluent assertions "assertThat(subject).has(...).is(...).throws(...)
    testImplementation "org.assertj:assertj-core:$assertj_version"
  }
}

evaluationDependsOnChildren()
project(":language-server").tasks.generateSysMLv2LanguageServer.dependsOn project(":language").tasks.grammarsJar

apply plugin: 'maven-publish'

def streamSymbolsVersion = '7.8.1'
def streamSymbolsJar = file("$rootDir/build/stream-symbols/stream-symbols-${streamSymbolsVersion}.jar")

tasks.register('validateStreamSymbolsJar') {
  inputs.file(streamSymbolsJar)
  doLast {
    if (!streamSymbolsJar.isFile()) {
      throw new GradleException("Missing stream-symbols artifact: ${streamSymbolsJar}")
    }
  }
}

publishing {
  publications {
    streamSymbols(MavenPublication) {
      groupId = 'de.monticore'
      artifactId = 'stream-symbols'
      version = streamSymbolsVersion
      artifact(streamSymbolsJar) {
        builtBy tasks.named('validateStreamSymbolsJar')
      }
      pom {
        name = 'stream-symbols'
        description = 'Stream symbols workaround artifact for the SysML v2 7.8.x release.'
      }
    }
  }
  repositories.maven {
    name = "Nexus"
    credentials.username nexusUser
    credentials.password nexusPassword
    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/monticore-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/monticore-snapshots/"
    url = streamSymbolsVersion.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
  }
}

tasks.register('publishStreamSymbolsToNexus') {
  group = 'publishing'
  description = 'Publishes the local stream-symbols 7.8.1 workaround artifact to SE Nexus.'
  dependsOn tasks.named('publishStreamSymbolsPublicationToNexusRepository')
}
